# Built-in catalog for `asimeow recommend`: project markers and the folders they generate.
#
# Same shape as config rules, plus a confidence for each folder:
#   high:  generated by a tool, never source (safe to exclude)
#   check: a generic name that is sometimes real source; look before excluding
#
# Keep it a superset of the rules `asimeow init` writes (a test checks this).

- name: node
  file_match: package.json
  exclusions:
    - { name: node_modules, confidence: high }
    - { name: .next, confidence: high }
    - { name: .nuxt, confidence: high }
    - { name: .output, confidence: high }
    - { name: .svelte-kit, confidence: high }
    - { name: .angular, confidence: high }
    - { name: .turbo, confidence: high }
    - { name: .parcel-cache, confidence: high }
    - { name: .docusaurus, confidence: high }
    - { name: .astro, confidence: high }
    - { name: .expo, confidence: high }
    - { name: .vercel, confidence: high }
    - { name: dist, confidence: check }
    - { name: build, confidence: check }
    - { name: out, confidence: check }
    - { name: coverage, confidence: check }
    - { name: storybook-static, confidence: check }

- name: rust
  file_match: Cargo.toml
  exclusions:
    - { name: target, confidence: high }

- name: go
  file_match: go.mod
  exclusions:
    # Sometimes committed on purpose.
    - { name: vendor, confidence: check }

- name: python
  file_match: requirements.txt
  exclusions: &python
    - { name: .venv, confidence: high }
    - { name: venv, confidence: high }
    - { name: __pycache__, confidence: high }
    - { name: __pypackages__, confidence: high }
    - { name: .tox, confidence: high }
    - { name: .nox, confidence: high }
    - { name: .mypy_cache, confidence: high }
    - { name: .ruff_cache, confidence: high }
    - { name: .pytest_cache, confidence: high }
    - { name: .eggs, confidence: high }
    - { name: build, confidence: check }
    - { name: dist, confidence: check }
    - { name: htmlcov, confidence: check }

- name: python-pyproject
  file_match: pyproject.toml
  exclusions: *python

- name: python-setup
  file_match: setup.py
  exclusions: *python

- name: python-pipenv
  file_match: Pipfile
  exclusions: *python

- name: jupyter
  file_match: "*.ipynb"
  exclusions:
    - { name: .ipynb_checkpoints, confidence: high }

- name: java
  file_match: pom.xml
  exclusions:
    - { name: target, confidence: high }

- name: gradle
  file_match: build.gradle*
  exclusions:
    - { name: .gradle, confidence: high }
    - { name: build, confidence: check }

- name: sbt
  file_match: build.sbt
  exclusions:
    - { name: target, confidence: high }
    - { name: .bloop, confidence: high }
    - { name: .metals, confidence: high }
    - { name: .bsp, confidence: high }

- name: clojure
  file_match: project.clj
  exclusions:
    - { name: target, confidence: high }
    - { name: .cpcache, confidence: high }

- name: clojure-deps
  file_match: deps.edn
  exclusions:
    - { name: .cpcache, confidence: high }

- name: net
  file_match: "*.csproj"
  exclusions: &dotnet
    - { name: obj, confidence: high }
    - { name: bin, confidence: high }
    - { name: packages, confidence: check }

- name: net-fsharp
  file_match: "*.fsproj"
  exclusions: *dotnet

- name: php
  file_match: composer.json
  exclusions:
    - { name: vendor, confidence: high }

- name: vagrant
  file_match: Vagrantfile
  exclusions:
    - { name: .vagrant, confidence: high }

- name: bower
  file_match: bower.json
  exclusions:
    - { name: bower_components, confidence: high }

- name: haskell
  file_match: stack.yaml
  exclusions:
    - { name: .stack-work, confidence: high }

- name: haskell-cabal
  file_match: "*.cabal"
  exclusions:
    - { name: dist-newstyle, confidence: high }

- name: carthage
  file_match: Cartfile
  exclusions:
    # Carthage/Checkouts is sometimes committed.
    - { name: Carthage, confidence: check }

- name: cocoapods
  file_match: Podfile
  exclusions:
    # Some teams commit Pods.
    - { name: Pods, confidence: check }

- name: swift
  file_match: Package.swift
  exclusions:
    - { name: .build, confidence: high }
    - { name: .swiftpm, confidence: high }

- name: xcode
  file_match: "*.xcodeproj"
  exclusions:
    - { name: DerivedData, confidence: high }
    - { name: build, confidence: check }

- name: elixir
  file_match: mix.exs
  exclusions:
    - { name: _build, confidence: high }
    - { name: deps, confidence: high }
    - { name: .elixir_ls, confidence: high }

- name: dart
  file_match: pubspec.yaml
  exclusions:
    - { name: .dart_tool, confidence: high }
    - { name: build, confidence: check }

- name: terraform
  file_match: "*.tf"
  exclusions:
    - { name: .terraform, confidence: high }

- name: zig
  file_match: build.zig
  exclusions:
    - { name: .zig-cache, confidence: high }
    - { name: zig-cache, confidence: high }
    - { name: zig-out, confidence: check }

- name: cmake
  file_match: CMakeLists.txt
  exclusions:
    - { name: cmake-build-debug, confidence: high }
    - { name: cmake-build-release, confidence: high }
    - { name: build, confidence: check }

- name: godot
  file_match: project.godot
  exclusions:
    - { name: .godot, confidence: high }
    - { name: .import, confidence: high }

- name: unity
  file_match: ProjectSettings
  exclusions:
    - { name: Library, confidence: high }
    - { name: Temp, confidence: high }
    - { name: obj, confidence: high }
    - { name: Logs, confidence: check }

- name: r
  file_match: "*.Rproj"
  exclusions:
    - { name: .Rproj.user, confidence: high }

- name: project
  file_match: "*.prj"
  exclusions:
    - { name: bin, confidence: check }
    - { name: debug, confidence: check }
